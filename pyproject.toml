# Tooling configuration only. Home Energy Advisor is a Home Assistant custom
# integration installed by copying `custom_components/`, not a distributed
# Python package, so there is deliberately no [project] table.

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
# `ALL` opts in to every stable rule ruff ships - and to every rule it will
# ship. That is deliberate: it buys a strict floor for free, alongside
# `mypy --strict` and a Sonar gate held at zero. The price is that an upgrade
# can enrol rules nobody chose. 0.16.1 brought two (CPY001, and formatting
# Python inside markdown fences), so a Dependabot ruff PR arriving red is
# routine rather than alarming.
#
# Triage when one does: does the rule express something this project actually
# believes? If so, fix the code. If not, add it to `ignore` with the reason
# inline - every entry below carries one, and an unexplained ignore is the
# thing to avoid. Never narrow `select` to silence a single rule: that also
# drops every future rule in the same linter, silently. Decided in HEA-72.
select = ["ALL"]
ignore = [
  # Conflicts with the formatter.
  "COM812",
  "ISC001",
  # Mutually exclusive with the docstring rules we do enforce (D211, D212).
  "D203",
  "D213",
  # The class docstring documents construction. A separate __init__ docstring
  # would restate the signature, which DOCUMENTATION_STANDARDS calls out as noise.
  "D107",
  # Would put a copyright header on all 41 files. The MIT grant is stated once,
  # in LICENSE, and Home Assistant custom integrations carry no per-file
  # notices. Enrolled by itself in ruff 0.16.1: `select = ["ALL"]` opts this
  # repo into every rule a release adds (HEA-71).
  "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# Test names and Given/When/Then comments are the documentation, so tests carry
# no docstrings; `assert` is the point; literal prices and kWh values are the
# realistic domain data the testing standards require. Test packages are not
# importable modules, so they need no __init__.py.
"tests/*" = ["D100", "D103", "S101", "PLR2004", "INP001"]
# A command-line tool, so its output *is* its interface (T201) and resolving
# `git` from PATH is what makes it portable across Windows, WSL and CI (S607).
# `scripts/` is a directory of entry points, not an importable package (INP001).
"scripts/*" = ["T201", "S607", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# custom_components/ is a namespace package (no __init__.py) but the integration
# below it is not, so mypy otherwise resolves the same file under two module
# names and refuses to check it.
explicit_package_bases = true
mypy_path = "."

# The test helper library ships no type information.
[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true

# PyYAML ships no stubs. It arrives as a hard Home Assistant dependency and is
# read only by the pin drift guard (tests/test_dependency_pins.py), so silencing
# it here is cheaper than adding types-PyYAML to what CI installs.
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on sys.path so `custom_components.home_energy_advisor`
# imports as Home Assistant loads it.
pythonpath = ["."]
# Required by pytest-homeassistant-custom-component.
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/home_energy_advisor"]
branch = true
# Paths relative to the repo root, not the source root. Without this the XML
# report names files as bare `__init__.py` and SonarQube cannot resolve them.
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
