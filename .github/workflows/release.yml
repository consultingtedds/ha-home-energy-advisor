name: Release

# Run by hand, always. A tag is offered to households as an update and cannot be
# withdrawn once an instance has installed it, so cutting one is a decision
# rather than a consequence of a commit landing.
#
# It was automatic - every green build on `main` whose commits earned a version.
# That shipped four releases in a day, which reads as instability to anyone
# looking at the release list, gives no time to notice a regression between
# them, and buys the households almost nothing: HACS only offers custom
# repositories an update every 48 hours anyway. Fixes are batched now, and an
# urgent one is still released the same day - by asking for it (2026-09-16).
#
# The version still comes from the commits, never from a number typed here.
on:
  workflow_dispatch:

# Never cancel a release in flight. A cancelled one can leave a tag pushed with
# no release behind it, which is a worse state than a slow queue.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Reading CI's conclusion for this commit, which is what stops a release being
  # cut from something that never passed.
  actions: read

jobs:
  release:
    name: tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and every tag: the version is derived from the
          # commits since the last release, and a shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # `main` has to be green before anything is tagged. The workflow is started
      # by hand now, so nothing else checks: without this, a release could be cut
      # from a commit whose tests never passed.
      - name: Check CI is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow=CI --branch=main --limit=20             --json headSha,conclusion --jq             "[.[] | select(.headSha == \"$GITHUB_SHA\")] | first | .conclusion")
          if [ "$conclusion" != "success" ]; then
            echo "CI on $GITHUB_SHA is ${conclusion:-missing}, not success."
            echo "Releasing an untested commit is how a household gets a broken update."
            exit 1
          fi

      - name: Work out whether this earns a release
        id: version
        run: |
          current=$(python -c "import json; print(json.load(open('custom_components/home_energy_advisor/manifest.json'))['version'])")
          echo "current=$current" >> "$GITHUB_OUTPUT"

          if ! git describe --tags --abbrev=0 --match='v[0-9]*' >/dev/null 2>&1 \
             && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No release has been cut yet, and the first one is deliberate."
            echo "Run this workflow by hand when HEA-32 is done."
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          next=$(python scripts/release_version.py "$current")
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ -z "$next" ]; then
            echo "Nothing since the last release changes what a household sees."
          else
            echo "$current -> $next"
          fi

      # Everything below is skipped when nothing earned a release, which is most
      # runs: documentation and dependency work do not produce one.
      - name: Put the version in the manifest
        if: steps.version.outputs.next != ''
        run: |
          python - <<'PY'
          import json
          import pathlib

          manifest = pathlib.Path("custom_components/home_energy_advisor/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version"] = "${{ steps.version.outputs.next }}"
          # Two-space indent and a trailing newline, matching what hassfest and
          # the repository's own hygiene hooks expect.
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      # Read it back before anything is tagged. This commit is pushed with the
      # workflow's own token, which by design triggers no workflows - so CI never
      # runs on it and nothing else would notice a manifest this step had
      # mangled. A tag, once a household has installed it, cannot be withdrawn.
      - name: Check the manifest is still valid
        if: steps.version.outputs.next != ''
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          expected = "${{ steps.version.outputs.next }}"
          path = pathlib.Path("custom_components/home_energy_advisor/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("version") != expected:
              sys.exit(f"manifest says {data.get('version')!r}, expected {expected!r}")
          if not data.get("domain") or not data.get("name"):
              sys.exit("the manifest lost a required key while being rewritten")
          print(f"manifest verified at {expected}")
          PY

      # The manifest is what HACS reads to decide whether a household is behind,
      # so it has to be inside the tag rather than pushed after it.
      #
      # The tag is annotated, and pushed by name. A lightweight tag is invisible
      # to `--follow-tags`, so the obvious spelling of this pushes the commit,
      # reports success, and leaves the release with nothing to attach itself to.
      - name: Commit, tag and push
        if: steps.version.outputs.next != ''
        run: |
          version="v${{ steps.version.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/home_energy_advisor/manifest.json
          git commit -m "chore(release): $version"
          git tag -a "$version" -m "$version"
          git push origin HEAD:main
          git push origin "$version"

      - name: Create the GitHub release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.next }}" \
            --title "v${{ steps.version.outputs.next }}" \
            --generate-notes \
            --verify-tag
